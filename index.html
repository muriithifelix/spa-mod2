
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordly Dictionary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="#" class="logo">Wordly<span>.</span></a>
    <button id="theme-btn" type="button"> Dark mode</button>
  </header>

  <main class="container">
    <section class="hero">
      <h1>WORDLY DICTIONARY</h1>
      <p class="subtitle">
Enter your word below
      </p>

      <form id="search-form">
        <input
          type="search"
          id="word-input"
          placeholder="Enter a word"
          aria-label="Word to search"
          required
        >
        <button type="submit" id="search-btn">Search</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" aria-label="Dictionary results"></section>

    <section class="favorites-section">
      <h2> FAVOURITEs</h2>
      <p class="subtitle">Favorite words list</p>
      <div id="favorites"></div>
    </section>
  </main>

  <footer>
    <p>A Single Page Application Project By RuiYi The Great</p>
  </footer>
    <script src="index.js" defer></script>

</body>
</html>
